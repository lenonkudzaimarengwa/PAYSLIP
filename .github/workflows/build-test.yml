name: ESS System Build CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Backend Module Dependencies
        run: |
          cd backend
          npm ci
      - name: Check Backend Syntax
        run: node --check backend/src/server.js

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Frontend Module Dependencies
        run: |
          cd frontend
          npm ci
      - name: Build Frontend
        run: npm run build --prefix frontend
